sonar.projectKey=omics-datascience_multiomix-frontend
sonar.organization=omics-datascience
sonar.projectName=Multiomix Frontend
sonar.projectVersion=1.0

# Sources - scan everything in src/
sonar.sources=src

# Exclude build outputs and configs
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/rspack.config.js,**/webpack.config.js

# Only scan TypeScript and JavaScript files
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx

# TypeScript/JavaScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
