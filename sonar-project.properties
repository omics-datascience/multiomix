sonar.projectKey=omics-datascience_multiomix-backend
sonar.organization=omics-datascience
sonar.projectName=Multiomix Backend
sonar.projectVersion=1.0

# Sources - scan everything in src/
sonar.sources=src

# Exclude frontend completely and other non-code files
sonar.exclusions=**/frontend/**,**/node_modules/**,**/migrations/**,**/__pycache__/**,**/venv/**,**/.venv/**,**/htmlcov/**,**/staticfiles/**,**/*.pyc,**/email/**

# Only scan Python files
sonar.inclusions=**/*.py

# Python settings
sonar.python.version=3.7,3.8,3.9,3.10,3.11
sonar.sourceEncoding=UTF-8
